{# Fondo decorativo de las secciones oscuras: brillos que respiran, rejilla tenue y foco de luz que sigue al mouse. #}
{# La sección que lo incluye necesita: relative isolate overflow-hidden data-foco. #}
<div class="pointer-events-none absolute inset-0 -z-10" aria-hidden="true">
  <div class="flotar-lento absolute -left-40 -top-48 h-[36rem] w-[36rem] rounded-full bg-rosa/25 blur-[120px]"></div>
  <div class="flotar-lento inverso absolute -bottom-56 -right-40 h-[40rem] w-[40rem] rounded-full bg-rosa-viejo/20 blur-[140px]"></div>
  <div class="fondo-grilla absolute inset-0"></div>
  <div class="foco-luz absolute inset-0"></div>
  <div class="absolute inset-x-0 bottom-0 h-px bg-gradient-to-r from-transparent via-rosa/40 to-transparent"></div>
</div>
